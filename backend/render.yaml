services:
  - type: web
    name: asklytics-api
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: USE_POSTGRES
        value: true
      - key: CORS_ORIGIN
        value: https://asklytics.vercel.app  # Updated for Vercel frontend
      # Database credentials (to be set in Render dashboard)
      - key: POSTGRES_URL
        sync: false  # Set manually in dashboard
      - key: SUPABASE_URL
        sync: false  # Set manually in dashboard
      - key: SUPABASE_KEY
        sync: false  # Set manually in dashboard
      - key: SUPABASE_JWT_SECRET
        sync: false  # Set manually in dashboard
      # AI API keys
      - key: GEMINI_API_KEY
        sync: false  # Set manually in dashboard
      - key: GROQ_API_KEY
        sync: false  # Set manually in dashboard
      # Security
      - key: JWT_SECRET
        generateValue: true  # Auto-generate secure secret
    restartPolicyType: never